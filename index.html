<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#282a36">
    <link rel="apple-touch-icon" href="./icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./app-info.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* Paleta Dracula Optimizada */
        :root {
            --bg: #282a36;
            --fg: #ffffff; /* Contraste máximo */
            --purple: #bd93f9;
            --pink: #ff79c6;
            --green: #50fa7b;
            --red: #ff5555;
            --orange: #ffb86c;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 31vw; /* Ajustado de 38vw para evitar desborde horizontal */
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Estilos de alerta con alto contraste y degradados */
        .mode-combate { 
            background: linear-gradient(to bottom, #ffffff 30%, #bd93f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(189, 147, 249, 0.3));
        }
        .mode-descanso { 
            background: linear-gradient(to bottom, #ffffff 30%, #50fa7b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(80, 250, 123, 0.4));
        }
        .last-60 { 
            background: linear-gradient(to bottom, #ffffff 30%, #ffb86c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 184, 108, 0.4));
        }
        .last-10 { 
            background: linear-gradient(to bottom, #ffffff 30%, #ff5555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(255, 85, 85, 0.6));
            animation: pulse 0.5s infinite alternate; 
        }

        /* Resplandor de fondo dinámico */
        .timer-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-container::before {
            content: '';
            position: absolute;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(189, 147, 249, 0.08) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            transition: background 0.5s;
        }

        .mode-descanso-glow .timer-container::before {
            background: radial-gradient(circle, rgba(80, 250, 123, 0.08) 0%, transparent 70%);
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.8; transform: scale(1.02); }
        }

        .btn-control {
            background: #44475a;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .btn-control:active {
            transform: scale(0.9);
            background: #6272a4;
        }

        .play-pause-circle {
            background: var(--purple);
            box-shadow: 0 0 30px rgba(189, 147, 249, 0.4);
        }

        /* Optimizaciones para Pantalla Horizontal (Landscape) */
        @media (orientation: landscape) {
            body {
                padding: 0 1rem;
            }
            .timer-display {
                font-size: 30vh; /* Reducido de 40vh */
            }
            nav {
                padding: 0.5rem 2rem !important; /* Reducido verticalmente */
            }
            footer {
                padding: 0.75rem !important; /* Reducido de 1.5rem */
                gap: 0.5rem !important; /* Reducido de 1rem */
            }
            .play-pause-circle {
                width: 4rem !important; /* Reducido de 5rem */
                height: 4rem !important;
            }
            .play-pause-circle i {
                width: 2rem !important;
                height: 2rem !important;
            }
            .btn-control {
                padding: 0.5rem !important; /* Reducido de 0.75rem */
            }
            #statusLabel {
                margin-bottom: 0.25rem !important; /* Reducido de 0.5rem */
                font-size: 0.75rem !important;
            }
            #nextInfo {
                margin-top: 0.25rem !important;
                font-size: 0.7rem !important;
            }
            #openMatBtn {
                padding: 0.15rem 0.75rem !important;
                font-size: 9px !important;
            }
        }
    </style>
</head>
<body class="safe-top safe-bottom">

    <!-- Indicadores Superiores (Compactos) -->
    <nav class="p-6 flex justify-between items-start">
        <div class="space-y-1">
            <span class="block text-[10px] uppercase tracking-widest text-[#6272a4] font-extrabold">Round</span>
            <div id="roundDisplay" class="text-2xl font-black text-[#bd93f9]">1 / 5</div>
        </div>
        <div class="text-right space-y-1">
            <span class="block text-[10px] uppercase tracking-widest text-[#6272a4] font-extrabold">Sesión Total</span>
            <div id="totalTime" class="text-2xl font-black text-[#8be9fd]">00:00</div>
        </div>
    </nav>

    <!-- Área del Timer Central (Protagonista) -->
    <main class="flex-grow flex flex-col items-center justify-center px-4">
        <div class="timer-container">
            <div id="statusLabel" class="text-lg font-black uppercase tracking-[0.4em] mb-4 text-[#ff79c6] drop-shadow-md">
                Prepárate
            </div>
            
            <div id="mainTimer" class="timer-display font-extrabold transition-all duration-300">
                05:00
            </div>

            <div id="nextInfo" class="mt-4 text-sm font-bold text-[#6272a4] opacity-80">
                Próximo: Descanso (01:00)
            </div>
        </div>
    </main>

    <!-- Controles Inferiores (Ergonomía Móvil) -->
    <footer class="p-10 flex flex-col gap-8 items-center">
        
        <!-- Botones de Acción -->
        <div class="flex items-center gap-10">
            <button onclick="resetTimer()" class="btn-control p-5 text-[#f8f8f2]">
                <i data-lucide="rotate-ccw" class="w-8 h-8"></i>
            </button>

            <button onclick="toggleTimer()" id="playBtn" class="play-pause-circle w-28 h-28 rounded-full flex items-center justify-center">
                <i id="playIcon" data-lucide="play" class="w-12 h-12 text-[#282a36] fill-current"></i>
            </button>

            <button onclick="toggleSettings()" class="btn-control p-5 text-[#f8f8f2]">
                <i data-lucide="sliders-horizontal" class="w-8 h-8"></i>
            </button>
        </div>

        <!-- Botón Modo Open Mat -->
        <div class="flex flex-col items-center gap-4">
            <button id="openMatBtn" onclick="toggleOpenMat()" class="text-[#6272a4] flex items-center gap-2 uppercase text-[10px] tracking-widest font-black border border-[#44475a] px-4 py-2 rounded-full">
                <i data-lucide="infinity" class="w-4 h-4"></i>
                Modo Open Mat
            </button>

            <!-- Botón Instalar App (Oculto por defecto) -->
            <button id="installAppBtn" class="hidden text-[#50fa7b] flex items-center gap-2 uppercase text-[10px] tracking-widest font-black border border-[#50fa7b] px-4 py-2 rounded-full transition-transform active:scale-95 shadow-[0_0_15px_rgba(80,250,123,0.2)]">
                <i data-lucide="download" class="w-4 h-4"></i>
                Instalar App
            </button>
        </div>
    </footer>

    <!-- Modal de Configuración -->
    <div id="settingsModal" class="fixed inset-0 bg-[#282a36] z-50 hidden flex flex-col p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black text-[#ff79c6]">Ajustes</h2>
            <button onclick="toggleSettings()"><i data-lucide="x" class="w-8 h-8"></i></button>
        </div>

        <div class="flex-grow space-y-8 overflow-y-auto pr-2">
            <div>
                <label class="block text-xs uppercase font-black text-[#6272a4] mb-3">Lucha (Minutos)</label>
                <div class="flex items-center gap-2">
                    <button onclick="changeValue('inRound', -1)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">-</button>
                    <input type="number" id="inRound" value="5" class="w-full bg-[#44475a] p-4 rounded-2xl text-4xl font-black border-none text-white outline-none text-center">
                    <button onclick="changeValue('inRound', 1)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">+</button>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase font-black text-[#6272a4] mb-3">Descanso (Segundos)</label>
                <div class="flex items-center gap-2">
                    <button onclick="changeValue('inRest', -5)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">-</button>
                    <input type="number" id="inRest" value="60" class="w-full bg-[#44475a] p-4 rounded-2xl text-4xl font-black border-none text-white outline-none text-center">
                    <button onclick="changeValue('inRest', 5)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">+</button>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase font-black text-[#6272a4] mb-3">Rounds</label>
                <div class="flex items-center gap-2">
                    <button onclick="changeValue('inTotal', -1)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">-</button>
                    <input type="number" id="inTotal" value="5" class="w-full bg-[#44475a] p-4 rounded-2xl text-4xl font-black border-none text-white outline-none text-center">
                    <button onclick="changeValue('inTotal', 1)" class="flex-shrink-0 w-16 h-16 bg-[#44475a] active:bg-[#6272a4] rounded-2xl flex items-center justify-center text-3xl font-black text-white">+</button>
                </div>
            </div>
        </div>

        <button onclick="saveSettings()" class="w-full bg-[#bd93f9] text-[#282a36] p-6 rounded-2xl font-black text-xl uppercase mt-6 mb-4 shadow-lg active:scale-95 transition-transform">
            ¡OSS! Guardar
        </button>

        <!-- Bloque de autor dinámico -->
        <div id="authorCredit" class="text-center text-[#6272a4] text-[10px] uppercase tracking-widest font-bold pb-4 opacity-70">
        </div>
    </div>

    <script>
        let config = { roundTime: 300, restTime: 60, totalRounds: 5 };
        let state = { 
            timeLeft: 300, isRunning: false, mode: 'round', 
            currentRound: 1, totalElapsed: 0, interval: null, wakeLock: null 
        };

        // --- Audio Pro ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration, type = 'square') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const notify = {
            start: () => { playSound(400, 1); playSound(600, 1); },
            end: () => playSound(200, 2),
            warning: () => playSound(800, 0.1, 'sine')
        };

        // --- Lógica del Reloj ---
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function changeValue(id, delta) {
            const el = document.getElementById(id);
            let val = parseInt(el.value) + delta;
            if (val < 0) val = 0; 
            el.value = val;
        }

        function updateUI() {
            const timerEl = document.getElementById('mainTimer');
            timerEl.textContent = formatTime(state.timeLeft);
            
            // Gestión de Colores y Contrastes
            timerEl.className = 'timer-display font-extrabold transition-all duration-300';
            document.body.classList.remove('mode-descanso-glow');
            const label = document.getElementById('statusLabel');

            // Bloquear botón de ajustes si está corriendo
            const settingsBtn = document.querySelector('button[onclick="toggleSettings()"]');
            if (state.isRunning) {
                settingsBtn.style.opacity = "0.3";
                settingsBtn.style.pointerEvents = "none";
            } else {
                settingsBtn.style.opacity = "1";
                settingsBtn.style.pointerEvents = "auto";
            }

            if (state.mode === 'rest') {
                timerEl.classList.add('mode-descanso');
                document.body.classList.add('mode-descanso-glow');
                label.textContent = "Descanso";
                label.style.color = "#50fa7b";
            } else {
                label.textContent = state.mode === 'round' ? "Lucha" : "Open Mat";
                label.style.color = "#ff79c6";
                if (state.timeLeft <= 10) timerEl.classList.add('last-10');
                else if (state.timeLeft <= 60) timerEl.classList.add('last-60');
                else timerEl.classList.add('mode-combate');
            }

            // Actualizar Próxima Fase
            const nextEl = document.getElementById('nextInfo');
            if (state.mode === 'round') {
                if (state.currentRound < config.totalRounds) {
                    nextEl.textContent = `Próximo: Descanso (${formatTime(config.restTime)})`;
                } else {
                    nextEl.textContent = "¡Sesión Final!";
                }
            } else if (state.mode === 'rest') {
                nextEl.textContent = `Próximo: Lucha (${formatTime(config.roundTime)})`;
            } else {
                nextEl.textContent = "Modo Libre";
            }

            document.getElementById('roundDisplay').textContent = `${state.currentRound} / ${config.totalRounds}`;
            document.getElementById('totalTime').textContent = formatTime(state.totalElapsed);
        }

        function tick() {
            if (state.timeLeft > 0) {
                state.timeLeft--;
                state.totalElapsed++;
                if (state.mode === 'round' && state.timeLeft <= 3 && state.timeLeft > 0) notify.warning();
            } else {
                handlePhase();
            }
            updateUI();
        }

        function handlePhase() {
            notify.end();
            if (state.mode === 'round') {
                if (state.currentRound < config.totalRounds) {
                    state.mode = 'rest';
                    state.timeLeft = config.restTime;
                } else {
                    resetTimer();
                    alert("¡Sesión Finalizada!");
                }
            } else {
                state.mode = 'round';
                state.currentRound++;
                state.timeLeft = config.roundTime;
                notify.start();
            }
        }

        function toggleTimer() {
            if (state.isRunning) {
                clearInterval(state.interval);
                state.isRunning = false;
                document.getElementById('playIcon').setAttribute('data-lucide', 'play');
            } else {
                if (state.timeLeft === config.roundTime) notify.start();
                state.interval = setInterval(tick, 1000);
                state.isRunning = true;
                document.getElementById('playIcon').setAttribute('data-lucide', 'pause');
                if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
            }
            lucide.createIcons();
            updateUI();
        }

        function resetTimer() {
            clearInterval(state.interval);
            state.isRunning = false;
            state.mode = 'round';
            state.currentRound = 1;
            state.timeLeft = config.roundTime;
            state.totalElapsed = 0;
            document.getElementById('playIcon').setAttribute('data-lucide', 'play');
            updateUI();
            lucide.createIcons();
        }

        function toggleOpenMat() {
            resetTimer();
            state.mode = 'openmat';
            state.timeLeft = 0;
            tick = () => { state.timeLeft++; state.totalElapsed++; updateUI(); };
            updateUI();
        }

        function toggleSettings() {
            if (state.isRunning) return;
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            const oldRoundTime = config.roundTime;
            const oldRestTime = config.restTime;

            config.roundTime = parseInt(document.getElementById('inRound').value) * 60;
            config.restTime = parseInt(document.getElementById('inRest').value);
            config.totalRounds = parseInt(document.getElementById('inTotal').value);
            
            // Si el tiempo no ha empezado a correr en esta fase, lo actualizamos al nuevo valor
            if (state.mode === 'round' && state.timeLeft === oldRoundTime) {
                state.timeLeft = config.roundTime;
            } else if (state.mode === 'rest' && state.timeLeft === oldRestTime) {
                state.timeLeft = config.restTime;
            }

            toggleSettings();
            updateUI();
        }

        // --- Lógica de Instalación PWA ---
        let deferredPrompt;
        const installAppBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevenir que Chrome muestre el prompt automáticamente
            e.preventDefault();
            // Guardar el evento para dispararlo luego
            deferredPrompt = e;
            // Mostrar el botón personalizado de instalación
            installAppBtn.classList.remove('hidden');
        });

        installAppBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Mostrar el prompt nativo
                deferredPrompt.prompt();
                // Esperar la respuesta del usuario
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App instalada con éxito');
                }
                // Limpiar la variable
                deferredPrompt = null;
                // Ocultar el botón
                installAppBtn.classList.add('hidden');
            }
        });

        window.addEventListener('appinstalled', () => {
            // Ocultar botón si ya se instaló
            installAppBtn.classList.add('hidden');
            deferredPrompt = null;
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // Mostrar autor dinámicamente desde app-info.js
        if (typeof AppInfo !== 'undefined') {
            document.getElementById('authorCredit').innerHTML = `
                Creado por <span class="text-[#8be9fd]">${AppInfo.authorName}</span> 🥋<br>
                <a href="mailto:${AppInfo.authorEmail}" class="lowercase text-xs opacity-80 mt-1 inline-block">${AppInfo.authorEmail}</a>
            `;
            // Inyectamos el meta tag HTML dinámicamente
            let metaAuthor = document.querySelector('meta[name="author"]');
            if (!metaAuthor) {
                metaAuthor = document.createElement('meta');
                metaAuthor.name = "author";
                document.head.appendChild(metaAuthor);
            }
            metaAuthor.setAttribute("content", `${AppInfo.authorName} - ${AppInfo.authorEmail}`);

            // Actualizamos el título de la pestaña dinámicamente
            if (AppInfo.appName) {
                document.title = AppInfo.appName;
            }
        }

        lucide.createIcons();
        updateUI();
    </script>
</body>
</html>
